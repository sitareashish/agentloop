[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloop"
version = "0.1.0"
description = "A minimal, dependency-free agent runtime: tool-use, a plan-act-observe loop, retries, token budgeting, and trajectory tracing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashish Sitare" }]
keywords = ["agent", "llm", "tool-use", "function-calling", "agents", "ai"]
dependencies = []  # the core runtime has zero third-party dependencies

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentloop --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
